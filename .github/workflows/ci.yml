name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned (not ubuntu-latest) so a new runner image cannot break the build unannounced.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version   # "3.11": newest available 3.11.x
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
