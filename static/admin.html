<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CitizenVoice NG officer console: triage queue, analytics, agency routing and model performance.">
  <title>CitizenVoice NG · Officer Console</title>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/admin.css">
  <script type="module" src="/static/js/admin.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="/admin">
      <span class="brand__logo" aria-hidden="true">CV</span>
      <span>
        <span class="brand__name">CitizenVoice NG</span>
        <span class="brand__tag">Government Grievance Desk · Officer Console</span>
      </span>
    </a>
    <nav class="nav" aria-label="Account">
      <span class="nav__user" data-user-name></span>
      <button class="nav__link" type="button" data-action="sign-out" id="sign-out" hidden>Sign out</button>
    </nav>
  </header>

  <!-- officer sign in -->
  <main id="login-view" class="container" hidden>
    <section class="card login-card" aria-labelledby="login-title">
      <h1 class="login-card__title" id="login-title">Officer sign in</h1>
      <p class="muted">Grievance desk officers and agency administrators.</p>
      <form class="form login-card__form" id="login-form">
        <div class="field">
          <label class="field__label" for="login-id">Email or phone</label>
          <input class="input" id="login-id" name="phone" autocomplete="username" required>
        </div>
        <div class="field">
          <label class="field__label" for="login-password">Password</label>
          <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p class="form-error" role="alert" data-error></p>
        <button class="btn btn--primary btn--block" type="submit">Sign in</button>
      </form>
    </section>
  </main>

  <!-- console -->
  <main id="main" class="container container--wide" hidden>
    <section class="kpis" id="kpis" aria-label="Key figures"></section>

    <div class="tabs console-tabs" role="tablist" aria-label="Console sections">
      <button class="tab is-active" type="button" role="tab" id="tab-queue" aria-selected="true" aria-controls="panel-queue" data-tab="queue">Triage Queue</button>
      <button class="tab" type="button" role="tab" id="tab-analytics" aria-selected="false" aria-controls="panel-analytics" data-tab="analytics" tabindex="-1">Analytics</button>
      <button class="tab" type="button" role="tab" id="tab-routing" aria-selected="false" aria-controls="panel-routing" data-tab="routing" tabindex="-1">Agency Routing</button>
      <button class="tab" type="button" role="tab" id="tab-model" aria-selected="false" aria-controls="panel-model" data-tab="model" tabindex="-1">Model Performance</button>
    </div>

    <section id="panel-queue" role="tabpanel" aria-labelledby="tab-queue">
      <form class="filters" id="filters" role="search">
        <label class="sr-only" for="filter-urgency">Priority</label>
        <select class="select" id="filter-urgency" name="urgency">
          <option value="">All priorities</option>
          <option>High</option>
          <option>Medium</option>
          <option>Low</option>
        </select>
        <label class="sr-only" for="filter-status">Status</label>
        <select class="select" id="filter-status" name="status">
          <option value="">All statuses</option>
          <option>Forwarded</option>
          <option>Acknowledged</option>
          <option>In Progress</option>
          <option>Resolved</option>
          <option>Closed</option>
        </select>
        <label class="sr-only" for="filter-category">Category</label>
        <select class="select" id="filter-category" name="category">
          <option value="">All categories</option>
        </select>
        <label class="sr-only" for="filter-q">Search</label>
        <input class="input filters__search" id="filter-q" name="q" type="search" placeholder="Search text or reference">
      </form>

      <div class="card card--flush">
        <div class="table-wrap">
          <table class="table table--interactive">
            <caption class="sr-only">Complaints ordered by priority. Select a row to open it.</caption>
            <thead>
              <tr>
                <th scope="col">Priority</th>
                <th scope="col">Reference</th>
                <th scope="col">Complaint</th>
                <th scope="col">Category / Agency</th>
                <th scope="col">Sentiment</th>
                <th scope="col">LGA</th>
                <th scope="col">Status</th>
                <th scope="col">Age</th>
              </tr>
            </thead>
            <tbody id="queue-rows"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="panel-analytics" role="tabpanel" aria-labelledby="tab-analytics" hidden></section>
    <section id="panel-routing" role="tabpanel" aria-labelledby="tab-routing" hidden></section>
    <section id="panel-model" role="tabpanel" aria-labelledby="tab-model" hidden></section>
  </main>

  <!-- complaint detail drawer -->
  <div class="drawer" id="drawer" hidden>
    <div class="drawer__backdrop" data-close-drawer></div>
    <aside class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title" tabindex="-1">
      <button class="drawer__close" type="button" aria-label="Close" data-close-drawer>&times;</button>
      <div id="drawer-body"></div>
    </aside>
  </div>
</body>
</html>
